---
name: Publish to PyPI

on: # checkov:skip=CKV_GHA_7:Manual version is intentional
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag or version being published (for audit)"
        required: false
        type: string
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/proligent-xml-generator
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.15
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build -r requirements.txt
      - name: Build distributions
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          # Do not include user and password for security reasons.
          # It uses "Trusted Publisher", which can be defined in PyPI.
          # https://pypi.org/manage/project/proligent-xml-generator/settings/publishing/
          repository-url: https://upload.pypi.org/legacy/
      - name: Upload built distributions
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-artifacts
          path: dist
          if-no-files-found: error
