---
# GitHub Workflow doc:
# https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions

name: Build

on:
  push:
    branches:
      - "**"
  schedule:
    - cron: 0 5 * * 6

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint code
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Lint code
        # cspell:ignore oxsecurity
        uses: oxsecurity/megalinter@62c799d895af9bcbca5eacfebca29d527f125a57 # v9.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.github_token }}

  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"] # fails on "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pip install -r requirements.txt
      - name: Test with pytest
        run: |
          pytest
      - name: Generate help docs from docstrings
        run: |
          export PYTHONPATH=src${PYTHONPATH:+:$PYTHONPATH}
          python scripts/generate_help.py
      - name: Upload generated XML artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-out-${{ matrix.python-version }}
          path: test/out
          if-no-files-found: ignore
      - name: Upload help docs
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: help-docs-${{ matrix.python-version }}
          path: build/help
          if-no-files-found: warn
